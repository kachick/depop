name: 🚀
on:
  workflow_call:
    inputs:
      chrome_artifact_name:
        required: true
        type: string
      firefox_artifact_name:
        required: true
        type: string
    secrets:
      AMO_API_KEY:
        required: false
      AMO_API_SECRET:
        required: false

jobs:
  release:
    # https://github.com/softprops/action-gh-release/issues/236#issuecomment-1150530128
    permissions:
      contents: write
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - name: Install unzip
        run: nix profile add --inputs-from . nixpkgs#unzip

      - name: Download Chrome artifact
        id: download_chrome
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.chrome_artifact_name }}
          skip-decompress: true

      - name: Download Firefox artifact
        id: download_firefox
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.firefox_artifact_name }}
          skip-decompress: true

      - name: Verify artifacts
        run: |
          test -f "${{ steps.download_chrome.outputs.download-path }}/${{ inputs.chrome_artifact_name }}"
          test -f "${{ steps.download_firefox.outputs.download-path }}/${{ inputs.firefox_artifact_name }}"

      - name: Sign Firefox package
        if: startsWith(github.ref, 'refs/tags/') && secrets.AMO_API_KEY != '' && secrets.AMO_API_SECRET != ''
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          FIREFOX_ZIP_PATH: ${{ steps.download_firefox.outputs.download-path }}/${{ inputs.firefox_artifact_name }}
        run: |
          unzip "$FIREFOX_ZIP_PATH" -d dist/firefox
          nix develop .#ci --command pnpm run sign:firefox

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_ASSET: ${{ steps.download_chrome.outputs.download-path }}/${{ inputs.chrome_artifact_name }}
          FIREFOX_ASSET: ${{ steps.download_firefox.outputs.download-path }}/${{ inputs.firefox_artifact_name }}
        run: |
          assets=(
            "$CHROME_ASSET"
            "$FIREFOX_ASSET"
          )
          if [ -d dist/signed-firefox ]; then
            for xpi in dist/signed-firefox/*.xpi; do
              if [ -f "$xpi" ]; then
                assets+=("$xpi")
              fi
            done
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes
