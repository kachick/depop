name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Flake check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - run: nix flake check

  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - run: nix develop --command pnpm run setup
      - run: nix develop --command pnpm run check

  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      chrome_artifact_name: ${{ fromJson(steps.build.outputs.report).chrome.productBasename }}
      firefox_artifact_name: ${{ fromJson(steps.build.outputs.report).firefox.productBasename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=
      - run: nix develop --command pnpm run setup
      - run: nix develop --command pnpm run check
      - name: Build
        id: build
        run: |
          tempfile="$(mktemp report.XXXX.json)"
          # Don't use subprocess when getting the result, it makes not easy to get the error messages
          nix develop --command pnpm run --silent build >"$tempfile"
          printf "report<<JSON\n%s\nJSON\n" "$(<"$tempfile")" | tee --append "$GITHUB_OUTPUT"

      - run: nix develop --command pnpm run check:firefox

      - name: Upload the chrome product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ fromJson(steps.build.outputs.report).chrome.productBasename }}'
          path: '${{ fromJson(steps.build.outputs.report).chrome.productPath }}'
          archive: false
          if-no-files-found: error

      - name: Upload the firefox product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ fromJson(steps.build.outputs.report).firefox.productBasename }}'
          path: '${{ fromJson(steps.build.outputs.report).firefox.productPath }}'
          archive: false
          if-no-files-found: error

  release:
    needs: [build]
    uses: $/.github/workflows/release.yml
    with:
      chrome_artifact_name: ${{ needs.build.outputs.chrome_artifact_name }}
      firefox_artifact_name: ${{ needs.build.outputs.firefox_artifact_name }}
    permissions:
      contents: write
